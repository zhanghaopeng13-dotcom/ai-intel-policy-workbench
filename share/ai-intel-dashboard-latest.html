<!-- 单文件离线分享版：数据已内嵌，可直接双击打开。生成日期 2026-07-17 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线分享版 · AI 每日情报工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M18 33c8-18 20-18 28 0' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='34' r='6' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface2:#fbfbfd; --raised:#ffffff;
    --border:#e8eaef; --border2:#dcdfe6; --line:#eef0f4;
    --text:#15171c; --text2:#5c6470; --muted:#878e9a; --faint:#aab0bb;
    --accent:#4f46e5; --accent2:#6366f1; --accent-soft:#eef0fe; --accent-line:#dcdcfb;
    --lab:#2563eb; --kol:#7c3aed; --paper:#0d9488; --oss:#ea580c; --fin:#db2777;
    --high:#dc2626; --high-bg:#fdeeee; --rising:#b45309; --rising-bg:#fcf2e4; --medium:#64748b; --medium-bg:#f1f3f6;
    --radius:14px; --radius-sm:10px;
    --shadow:0 4px 20px rgba(20,28,54,.07); --shadow-lg:0 18px 50px rgba(20,28,54,.16);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:0}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  svg{display:block}
  .ic{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d6dae1;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#c2c7d0}

  .app{display:flex;min-height:100vh}
  /* ---------- 侧栏 ---------- */
  .sidebar{width:228px;flex:0 0 228px;background:var(--surface);border-right:1px solid var(--border);
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#fff;flex:none}
  .brand .mark .ic{width:19px;height:19px;stroke-width:1.9}
  .brand h1{font-size:14.5px;font-weight:600;letter-spacing:0;line-height:1.2}
  .brand small{display:block;color:var(--faint);font-size:10.5px;font-weight:500;letter-spacing:0;margin-top:1px}
  nav{display:flex;flex-direction:column;gap:1px;margin-top:4px;overflow-y:auto}
  .nav-sec{color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:uppercase;padding:14px 10px 5px}
  .nav-i{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--text2);
    font-weight:500;font-size:13.5px;cursor:pointer;transition:.13s;position:relative}
  .nav-i .ic{width:18px;height:18px;color:var(--muted);transition:.13s}
  .nav-i:hover{background:var(--surface2);color:var(--text)}
  .nav-i:hover .ic{color:var(--text2)}
  .nav-i.on{background:var(--accent-soft);color:var(--accent)}
  .nav-i.on .ic{color:var(--accent)}
  .nav-i.on:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .nav-i .ct{margin-left:auto;font-size:11px;font-weight:600;color:var(--faint);font-family:var(--mono)}
  .nav-i.on .ct{color:var(--accent)}
  .side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;line-height:1.6}
  .side-foot b{color:var(--text2);font-weight:600}

  /* ---------- 主区 ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--border);padding:13px 30px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .topbar .tt{font-size:17px;font-weight:600;letter-spacing:0}
  .topbar .td{color:var(--muted);font-size:12.5px;margin-top:1px}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);
    border-radius:10px;padding:7px 12px;min-width:210px;transition:.15s}
  .search:focus-within{border-color:var(--accent-line);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .search .ic{width:16px;height:16px;color:var(--muted)}
  .search input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:13px;font-family:inherit}
  .search input::placeholder{color:var(--faint)}
  .seg{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px}
  .seg button{background:none;border:none;color:var(--text2);padding:5px 11px;border-radius:7px;cursor:pointer;
    font-size:12.5px;font-weight:500;font-family:inherit;transition:.12s}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(20,28,54,.1)}
  .content{padding:26px 30px 70px;max-width:1200px;width:100%}
  .menu-btn{display:none}

  /* ---------- 概览 ---------- */
  .hero-note{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent-line);
    border-radius:12px;padding:11px 15px;margin-bottom:20px;color:#3b35b8;font-size:12.5px}
  .hero-note .ic{width:17px;height:17px;color:var(--accent);flex:none}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:8px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px}
  .stat .n{font-size:25px;font-weight:680;letter-spacing:0;line-height:1;font-feature-settings:"tnum"}
  .stat .l{color:var(--muted);font-size:12px;margin-top:7px;font-weight:500}
  .stat.hl{background:linear-gradient(150deg,#4f46e5,#6366f1);border:none;color:#fff}
  .stat.hl .l{color:#dcdcfb}

  .sec{display:flex;align-items:center;gap:11px;margin:30px 0 15px}
  .sec h2{font-size:15.5px;font-weight:600;letter-spacing:0;display:flex;align-items:center;gap:8px}
  .sec h2 .ic{width:18px;height:18px;color:var(--text2)}
  .sec .ln{flex:1;height:1px;background:var(--line)}
  .sec .more{color:var(--accent);font-size:12.5px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:3px}
  .sec .more .ic{width:14px;height:14px}
  .sec .sub{color:var(--faint);font-size:12px}

  .mood{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
    border-left:3px solid var(--fin);border-radius:0 12px 12px 0;padding:13px 16px;margin-bottom:4px}
  .mood .ic{width:18px;height:18px;color:var(--fin);flex:none;margin-top:1px}
  .mood .mt{font-size:12.8px;color:var(--text2);line-height:1.6}

  /* 今日热点 */
  .hotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
  .hot{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;
    cursor:pointer;transition:.16s;position:relative;overflow:hidden}
  .hot:hover{border-color:var(--border2);box-shadow:var(--shadow);transform:translateY(-1px)}
  .hot .hh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .hot .fl{width:16px;height:16px;flex:none}
  .hot .ht{font-weight:600;font-size:13.8px;line-height:1.4;flex:1}
  .hot .hs{color:var(--text2);font-size:12.6px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .hot .hf{display:flex;align-items:center;gap:7px;margin-top:12px}
  .dots{display:flex;gap:4px}
  .dot{width:7px;height:7px;border-radius:50%}
  .hot .rel{color:var(--faint);font-size:11px;font-weight:500;margin-left:auto;display:flex;align-items:center;gap:3px}
  .hot .rel .ic{width:13px;height:13px}

  /* 卡片网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(322px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;
    cursor:pointer;transition:.16s;position:relative;display:flex;flex-direction:column}
  .card:hover{border-color:var(--border2);box-shadow:var(--shadow);transform:translateY(-1px)}
  .card .ct{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding-right:24px}
  .dimtag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text2)}
  .dimtag .d{width:8px;height:8px;border-radius:50%}
  .heat{margin-left:auto;font-size:10.5px;font-weight:600;padding:2.5px 8px;border-radius:20px;letter-spacing:0}
  .heat.h-high{color:var(--high);background:var(--high-bg)}
  .heat.h-rising{color:var(--rising);background:var(--rising-bg)}
  .heat.h-medium{color:var(--medium);background:var(--medium-bg)}
  .card h3{font-size:14.5px;font-weight:600;line-height:1.45;letter-spacing:0;margin-bottom:8px}
  .card .ds{color:var(--text2);font-size:13px;line-height:1.62;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
  .card .cf{display:flex;align-items:center;gap:6px;margin-top:13px;flex-wrap:wrap}
  .tag{font-size:10.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:6px;font-weight:500}
  .card .dt{color:var(--faint);font-size:11px;margin-left:auto;font-family:var(--mono);font-weight:500}
  .star{position:absolute;top:14px;right:14px;cursor:pointer;color:var(--faint);transition:.14s;z-index:2;padding:2px}
  .star .ic{width:17px;height:17px}
  .star:hover{color:var(--rising);transform:scale(1.12)}
  .star.on{color:#f59e0b}
  .star.on .ic{fill:#f59e0b;stroke:#f59e0b}
  .card.has-star h3{padding-right:24px}
  .badges{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
  .bpot{font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .bpot:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .pot-star{background:#fff4e8;color:#c2410c;border:1px solid #fcd9b6}
  .pot-verified{background:#eef6ee;color:#2f7d4f;border:1px solid #cfe6d4}
  .pot-steady{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
  .btrade{font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;background:#eaf1ff;color:#1d4ed8;border:1px solid #cdddff;white-space:nowrap}
  .bpolicy{font-size:10px;font-weight:650;padding:2px 8px;border-radius:6px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;white-space:nowrap}
  .bregion{font-size:10px;font-weight:650;padding:2px 8px;border-radius:6px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;white-space:nowrap}
  .bimpact{font-size:10px;font-weight:650;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .bimpact.good{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.bimpact.bad{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.bimpact.neutral{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
  .impact-line{margin:10px 0 2px;padding:9px 11px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--text);font-size:12.5px;line-height:1.55}
  mark.watch{background:#fef08a;color:inherit;border-radius:3px;padding:0 2px}
  .xsrc{background:#f1f8fe;border:1px solid #d6e9f8;border-radius:11px;padding:11px 14px;margin:14px 0}
  .xsrc .xl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#0369a1;margin-bottom:6px;text-transform:uppercase;letter-spacing:0}
  .xsrc .xl .ic{width:14px;height:14px}
  .xsrc a{display:block;font-size:12px;color:#0369a1;margin:3px 0;word-break:break-all;font-family:var(--mono)}

  .empty{text-align:center;color:var(--faint);padding:64px 20px}
  .empty .ic{width:38px;height:38px;margin:0 auto 12px;color:var(--border2);stroke-width:1.4}

  /* ---------- 弹窗 ---------- */
  .overlay{position:fixed;inset:0;background:rgba(22,26,40,.34);backdrop-filter:blur(3px);z-index:100;
    display:none;align-items:flex-start;justify-content:center;padding:46px 18px;overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:680px;width:100%;
    padding:0;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
  .m-head{padding:22px 26px 0;position:relative}
  .m-bar{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap;padding-right:36px}
  .m-back{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text2);cursor:pointer;
    font-weight:500;padding:5px 10px 5px 7px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);margin-right:2px}
  .m-back:hover{background:#fff;border-color:var(--border2);color:var(--text)}
  .m-back .ic{width:15px;height:15px}
  .m-close{position:absolute;top:18px;right:20px;cursor:pointer;color:var(--muted);padding:5px;border-radius:8px}
  .m-close:hover{background:var(--surface2);color:var(--text)}
  .m-close .ic{width:19px;height:19px}
  .m-head h2{font-size:20px;font-weight:650;line-height:1.38;letter-spacing:0;padding-right:26px}
  .m-orig{color:var(--faint);font-size:12.5px;font-style:italic;margin-top:7px}
  .m-kv{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}
  .kv{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--text2)}
  .kv b{color:var(--muted);font-weight:500}
  .m-body{padding:18px 26px 24px}
  .blk{margin:16px 0}
  .blk .bl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:0;
    text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .blk .bl .ic{width:14px;height:14px}
  .blk .bd{color:var(--text);font-size:13.8px;line-height:1.74}
  .blk.detail{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .blk.detail .bl{color:var(--accent)}
  .blk.why .bl{color:var(--rising)}
  .blk.now .bl{color:var(--oss)}
  .blk.buzz{background:#f7f5ff;border:1px solid #e9e5fb;border-radius:12px;padding:14px 16px}
  .blk.buzz .bl{color:var(--kol)}
  .blk.ex{background:#f0fbf8;border:1px solid #d9f0ea;border-radius:12px;padding:14px 16px}
  .blk.ex .bl{color:var(--paper)}
  .m-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
  .m-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:17px;border-top:1px solid var(--line)}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;
    border:none;padding:9px 16px;border-radius:10px;cursor:pointer;font-family:inherit;transition:.13s}
  .btn:hover{background:#4338ca}
  .btn .ic{width:16px;height:16px;stroke-width:2}
  .btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border2)}
  .btn.ghost:hover{background:var(--surface2)}
  .m-src{flex:1;min-width:180px;text-align:right;font-size:11px;color:var(--faint);line-height:1.5}
  .m-src a{font-size:11px}
  /* 热点弹窗里的关联条目 */
  .rel-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.14s}
  .rel-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
  .rel-card .rt{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .rel-card h4{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:5px}
  .rel-card .rs{color:var(--text2);font-size:12.4px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rel-card .rd{color:var(--faint);font-size:11px;font-family:var(--mono);margin-top:7px;display:flex;align-items:center;gap:5px}

  /* ---------- 关于页 ---------- */
  .prose{max-width:880px}
  .prose h3{font-size:16px;font-weight:600;margin:26px 0 11px;display:flex;align-items:center;gap:9px;letter-spacing:0}
  .prose h3 .ic{width:18px;height:18px;color:var(--accent)}
  .prose p{color:var(--text2);margin:9px 0;font-size:13.6px;line-height:1.75}
  .prose b{color:var(--text);font-weight:600}
  .prose code{font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:5px;color:var(--text2)}
  .ul{list-style:none;margin:8px 0}
  .ul li{position:relative;padding-left:22px;margin:7px 0;color:var(--text2);font-size:13.6px;line-height:1.7}
  .ul li:before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .loop{display:flex;flex-wrap:wrap;gap:11px;margin:18px 0}
  .lstep{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 14px;position:relative}
  .lstep .ln{font-size:10.5px;color:var(--faint);font-weight:600;font-family:var(--mono)}
  .lstep .lt{font-weight:600;font-size:13.5px;margin:4px 0 5px;display:flex;align-items:center;gap:7px}
  .lstep .lt .ic{width:16px;height:16px;color:var(--accent)}
  .lstep .ld{color:var(--text2);font-size:12px;line-height:1.55}
  .arch{display:flex;flex-direction:column;gap:9px;margin:16px 0}
  .layer{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;gap:13px;align-items:center}
  .layer .lic{width:36px;height:36px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
  .layer .lic .ic{width:18px;height:18px;color:var(--accent)}
  .layer .lt{font-weight:600;font-size:13.5px}
  .layer .ld{color:var(--text2);font-size:12.3px;margin-top:2px}
  .tbl{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:14px 0}
  table{border-collapse:collapse;width:100%;font-size:12.8px}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--surface2);color:var(--text);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:none}
  td{color:var(--text2)}
  td code{font-size:11.5px}
  .pill{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:1px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.new{background:#e7f8f0;color:#0d9488}
  .note{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text2);font-size:12.6px;line-height:1.65;margin:13px 0}
  .note.tip{background:var(--accent-soft);border-color:var(--accent-line);color:#3b35b8}

  .dim-head{display:flex;align-items:center;gap:11px;margin-bottom:5px}
  .dim-head .di{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
  .dim-head .di .ic{width:17px;height:17px;color:#fff}
  .dim-head .dn{font-size:17px;font-weight:650;letter-spacing:0}
  .dim-ov{color:var(--text2);font-size:13px;line-height:1.72;margin:8px 0 20px;max-width:900px}

  if(ev)ev.stopPropagation();

function potBadge(p){var cls=/潜力|Rising/i.test(p)?"pot-star":(/已验证|Validated/i.test(p)?"pot-verified":"pot-steady");return '<span class="bpot '+cls+'">'+esc(p)+'</span>';}
function highlightWatch(s,words){(words||[]).forEach(function(w){var safe=esc(w),re=new RegExp(safe.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');s=s.replace(re,function(m){return '<mark class="watch">'+m+'</mark>'})});return s;}

function applyFilter(items){

function renderTodayLatest(d){
  var todayItems=(d.items||[]).filter(function(it){return it.date===d.date;});
  var todayIds={};todayItems.forEach(function(it){todayIds[it.id]=true;});
  var topics=(d.hot_topics_today||[]).filter(function(t){return (t.related||[]).some(function(id){return todayIds[id];});});
  var ids={};topics.forEach(function(t){(t.related||[]).forEach(function(id){if(todayIds[id])ids[id]=true;});});
  var items=todayItems.filter(function(it){return ids[it.id];});
  var h='<div class="note tip">严格只展示发布日期或事件日期为 '+esc(d.date)+' 的热点；历史政策不会进入本板块。</div>';
  h+=hotGrid(topics);
  h+='<div class="sec"><h2>'+ico('flame')+'今日热点关联情报</h2><div class="ln"></div><span class="sub">'+items.length+' 条</span></div>';
  h+=grid(items);
  return h;
}

    if(d.practice_list&&d.practice_list.length){
      h+='<div class="sec"><h2>'+ico('bulb')+T("practice")+'</h2><div class="ln"></div></div>';
      h+='<div class="prose"><ul class="ul">'+d.practice_list.map(function(p){return '<li>'+esc(p)+'</li>'}).join("")+'</ul></div>';
    }
    h+='<div class="sec"><h2>'+ico('quote')+T("hot_discussions")+'</h2><div class="ln"></div></div>';
  }
  h+=grid(items);
  return h;
}

function renderHot(d){
  var h='<div class="note tip">'+T("hot_note")+'</div>';
  h+=hotGrid(d.hot_topics_today||[]);
  h+='<div class="sec"><h2>'+ico('pulse')+T("recent_tracking")+'</h2><div class="ln"></div><span class="sub">'+T("appears_2")+'</span></div>';
  var tr=computeTrending();
  if(tr.length){
    h+='<div class="tbl"><table><tr><th>'+T("topic_tag")+'</th><th>'+T("days_seen")+'</th><th>'+T("total_items")+'</th></tr>'+
      tr.map(function(t){return '<tr><td>'+esc(t.name)+'</td><td><span class="pill">'+t.days+' '+T("day_unit")+'</span></td><td>'+t.count+'</td></tr>'}).join("")+'</table></div>';
  }else{
    h+='<div class="note">'+T("only_days")+' <b>'+(MANIFEST.dates||[]).length+'</b> '+T("need_days")+'<br><div style="margin-top:8px">'+todayTags(d)+'</div></div>';
  }
  return h;
}
function todayTags(d){
  var c={};d.items.forEach(function(it){(it.tags||[]).forEach(function(t){c[t]=(c[t]||0)+1})});
  return Object.keys(c).sort(function(a,b){return c[b]-c[a]}).slice(0,10).map(function(t){return '<span class="tag" style="margin:0 4px 4px 0;display:inline-block">'+esc(t)+' · '+c[t]+'</span>'}).join("");
}
function computeTrending(){
  var dates=(MANIFEST.dates||[]).slice(0,7),seen={};
  dates.forEach(function(dd){var dy=daily(dd.date);if(!dy)return;var loc={};
    (dy.hot_topics_today||[]).forEach(function(ht){loc[ht.title]=true;});
    (dy.items||[]).forEach(function(it){(it.tags||[]).forEach(function(t){loc["#"+t]=true;});});
    Object.keys(loc).forEach(function(n){if(!seen[n])seen[n]={name:n,days:0,count:0};seen[n].days++;});});
  return Object.keys(seen).map(function(k){return seen[k]}).filter(function(t){return t.days>=2}).sort(function(a,b){return b.days-a.days});
}

function renderMarks(){
  var m=getMarks(),keys=Object.keys(m).sort(function(a,b){return m[b].ts-m[a].ts});
  if(!keys.length)return '<div class="empty">'+ico('star')+T("mark_empty")+'</div>';
  var h='<div class="note tip"><b>'+keys.length+'</b> '+T("mark_tip")+'</div><div class="grid">';
  h+=keys.map(function(k){var it=m[k],di=DIM[it.dim]||{};
    var tags=(it.tags||[]).slice(0,3).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("");
    return '<div class="card has-star" onclick="openItemAt(\''+it.date+'\',\''+it.id+'\')">'+
      '<div class="star on" onclick="toggleMark(\''+it.date+'\',\''+it.id+'\',event)">'+ico('star')+'</div>'+
      '<div class="ct"><span class="dimtag"><span class="d" style="background:'+(di.c||'#999')+'"></span>'+(di.cn||"")+'</span><span class="heat h-'+it.heat+'">'+heatCn(it.heat)+'</span></div>'+
      '<h3>'+esc(it.title)+'</h3><div class="ds">'+esc(it.summary)+'</div>'+
      '<div class="cf">'+tags+'<span class="dt">'+esc(it.date2||it.date)+'</span></div></div>';
  }).join("")+'</div>';
  return h;
}

function renderHistory(){
  var h='<div class="note tip">'+T("history_tip")+'</div><div class="histlist">';
  h+=(MANIFEST.dates||[]).map(function(dd){var cur=dd.date===state.date;
    return '<div class="hist'+(cur?' cur':'')+'" onclick="switchDate(\''+dd.date+'\')"><div class="hic">'+ico('doc')+'</div>'+
      '<div><div class="hd">'+esc(dd.label)+'</div><div class="hc">'+esc(dd.date)+' · '+(dd.count||"-")+' '+T("intel")+'</div></div>'+
      '<div class="go">'+(cur?T("current"):T("switch"))+'</div></div>';
  }).join("")+'</div>';
  return h;
}
function switchDate(date){loadDigest(date,function(){state.date=date;state.view="overview";window.scrollTo(0,0);render();});}
function langKey(date){return date+"#en";}
function loadBaseDigest(date,cb){
  var db=window.__DAILY__||{};
  if(db[date]){cb&&cb();return;}
  if(loadedLang[date]){cb&&cb();return;}
  loadedLang[date]=true;
  var s=document.createElement("script");
  s.src="data/"+date+"/digest.js";
  s.onload=function(){cb&&cb();};
  s.onerror=function(){alert(T("not_found")+" "+date+" data file");};
  document.head.appendChild(s);
}
function loadDigest(date,cb){
  date=date||state.date;
  var db=window.__DAILY__||{};
  if(UI_LANG==="en"&&!db[langKey(date)]&&!loadedLang[langKey(date)]){
    loadedLang[langKey(date)]=true;
    var se=document.createElement("script");
    se.src="data/"+date+"/digest.en.js";
    se.onload=function(){cb&&cb();};
    se.onerror=function(){loadBaseDigest(date,cb);};
    document.head.appendChild(se);
    return;
  }
  loadBaseDigest(date,cb);
}

/* ---------- 弹窗（带返回栈） ---------- */
function openItem(id){openItemAt(state.date,id);}
function openItemAt(date,id){modalStack=[{type:"item",date:date,id:id}];loadDigest(date,renderModal);}
function openHot(i){modalStack=[{type:"hot",i:i}];renderModal();}
function pushItem(date,id){modalStack.push({type:"item",date:date,id:id});renderModal();}
function modalBack(){modalStack.pop();if(modalStack.length)renderModal();else closeModal();}
function closeModal(){modalStack=[];document.getElementById("overlay").classList.remove("show");}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(modalStack.length>1)modalBack();else closeModal();}});

function renderModal(){
  var top=modalStack[modalStack.length-1];if(!top)return;
  var hasBack=modalStack.length>1;
  if(top.type==="hot")document.getElementById("modal").innerHTML=hotModalHTML(top.i,hasBack);
  else loadDigest(top.date,function(){document.getElementById("modal").innerHTML=itemModalHTML(top.date,top.id,hasBack);});
  document.getElementById("overlay").classList.add("show");
}
function backBtn(hasBack){return hasBack?'<span class="m-back" onclick="modalBack()">'+ico('back')+'返回</span>':'';}

function itemModalHTML(date,id,hasBack){
  var it=findItem(date,id);if(!it)return "";
  var di=DIM[it.dim]||{},mt=it.meta||{},mk=isMarked(date,id);
  var kv="";
  if(mt.company)kv+='<span class="kv"><b>公司　</b>'+esc(mt.company)+'</span>';
  if(mt.subfield)kv+='<span class="kv"><b>子方向　</b>'+esc(mt.subfield)+'</span>';
  if(mt.org)kv+='<span class="kv"><b>机构　</b>'+esc(mt.org)+'</span>';
  if(mt.stars)kv+='<span class="kv"><b>Stars　</b>'+esc(mt.stars)+'</span>';
  if(mt.lang)kv+='<span class="kv"><b>语言　</b>'+esc(mt.lang)+'</span>';
  if(mt.try)kv+='<span class="kv"><b>上手　</b>'+esc(mt.try)+'</span>';
  kv+='<span class="kv"><b>日期　</b>'+esc(it.date)+'</span>';
  if(it.potential)kv+='<span class="kv"><b>潜力　</b>'+esc(it.potential)+'</span>';
  if(it.is_trading)kv+='<span class="kv"><b>方向　</b>AI+交易</span>';
  if(it.policy){kv+='<span class="kv"><b>发布机关　</b>'+esc(it.policy.issuer||'待明确')+'</span>';kv+='<span class="kv"><b>生效日期　</b>'+esc(it.policy.effective_date||'待明确')+'</span>';if(it.policy.affected_industries&&it.policy.affected_industries.length)kv+='<span class="kv"><b>影响行业　</b>'+esc(it.policy.affected_industries.join('、'))+'</span>';}
  if(it.policy&&it.policy.region)kv+='<span class="kv"><b>地区　</b>'+esc(it.policy.region)+'</span>';
  var b="";
  b+=blk("","grid","小白速览",it.summary);
  if(it.impact_summary)b+=blk("why","pulse","赛道影响 · "+(it.impact_sentiment||"中性"),it.impact_summary);
  if(it.detail)b+=blk("detail","book","详细版",it.detail);
  if(it.key_points&&it.key_points.length)b+=listBlk("detail","list","关键要点",it.key_points);
  if(it.examples&&it.examples.length)b+=listBlk("ex","bulb","例子 / 场景",it.examples);
  if(it.product_implications&&it.product_implications.length)b+=listBlk("why","star","产品启发",it.product_implications);
  if(it.limitations&&it.limitations.length)b+=listBlk("","shield","边界 / 不要过度外推",it.limitations);
  if(it.why_now)b+=blk("now","refresh","为什么现在火",it.why_now);
  if(it.why)b+=blk("why","star","为什么值得关注",it.why);
  if(mt.novelty)b+=blk("","bulb","核心创新",mt.novelty);
  if(mt.how)b+=blk("","gear","内部逻辑 / 架构",mt.how);
  if(mt.highlights)b+=blk("","bulb","特点亮点",mt.highlights);
  if(mt.viewpoints)b+=blk("","quote","观点 / 分歧",mt.viewpoints);
  if(it.buzz)b+=blk("buzz","quote","社区在说",it.buzz);
  if(it.example)b+=blk("ex","bulb","案例 / 类比",it.example);
  if(it.x_src&&it.x_src.length)b+='<div class="xsrc"><div class="xl">'+ico('link')+'X 一手来源</div>'+it.x_src.map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>'}).join("")+'</div>';
  var srcs=(mt.sources&&mt.sources.length)?mt.sources:(it.url?[it.url]:[]);
  var srcL=srcs.map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https?:\/\//,"").split("/")[0])+'</a>'}).join(" · ");
  var tags=(it.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join(" ");
  return '<div class="m-head"><span class="m-close" onclick="closeModal()">'+ico('x')+'</span>'+
    '<div class="m-bar">'+backBtn(hasBack)+
      '<span class="dimtag"><span class="d" style="background:'+(di.c||'#999')+'"></span>'+(di.cn||"")+'</span>'+
      '<span class="heat h-'+it.heat+'">'+heatCn(it.heat)+'</span>'+
      '<span style="color:var(--faint);font-size:12px;margin-left:auto">'+esc(it.source||"")+'</span></div>'+
    '<h2>'+esc(it.title)+'</h2>'+(it.orig?'<div class="m-orig">'+esc(it.orig)+'</div>':'')+
    '<div class="m-kv">'+kv+'</div></div>'+
    '<div class="m-body">'+b+
      '<div class="m-tags">'+tags+'</div>'+
      '<div class="m-foot">'+
        ((it.policy&&it.policy.original_url)||it.url?'<a class="btn" href="'+esc((it.policy&&it.policy.original_url)||it.url)+'" target="_blank" rel="noopener">'+ico('ext')+'查看原文</a>':'')+
        '<button class="btn ghost" data-star="'+mkKey(date,id)+'" onclick="toggleMark(\''+date+'\',\''+id+'\',event)">'+ico('star')+(mk?'已标记':'标记')+'</button>'+
        (srcL?'<span class="m-src">来源 · '+srcL+'</span>':'')+
      '</div></div>';
}
function blk(cls,icn,label,body){return '<div class="blk '+cls+'"><div class="bl">'+ico(icn)+esc(label)+'</div><div class="bd">'+esc(body)+'</div></div>';}
function listBlk(cls,icn,label,arr){
  var body='<ul class="ul" style="margin:0">'+(arr||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';
  return '<div class="blk '+cls+'"><div class="bl">'+ico(icn)+esc(label)+'</div><div class="bd">'+body+'</div></div>';
}

function hotModalHTML(i,hasBack){
  var d=daily(),ht=(d.hot_topics_today||[])[i];if(!ht)return "";
  var dims=(ht.dims||[]).map(function(dm){return '<span class="dimtag" style="margin-right:8px"><span class="d" style="background:'+(DIM[dm]?DIM[dm].c:'#999')+'"></span>'+(DIM[dm]?DIM[dm].cn:dm)+'</span>'}).join("");
  var rel=(ht.related||[]).map(function(id){return findItem(state.date,id);}).filter(Boolean);
  var cards=rel.map(function(it){var di=DIM[it.dim]||{};
    return '<div class="rel-card" onclick="pushItem(\''+state.date+'\',\''+it.id+'\')">'+
      '<div class="rt"><span class="dimtag"><span class="d" style="background:'+(di.c||'#999')+'"></span>'+(di.cn||"")+'</span><span class="heat h-'+it.heat+'" style="margin-left:auto">'+heatCn(it.heat)+'</span></div>'+
      '<h4>'+esc(it.title)+'</h4><div class="rs">'+esc(it.summary)+'</div>'+
      '<div class="rd">'+ico('clock')+esc(it.date)+'　·　'+esc(it.source||"")+'</div></div>';
  }).join("");
  var fl=ht.heat==="high"?'<span style="color:var(--high)">'+ico('flame')+'</span>':'<span style="color:var(--rising)">'+ico('fin')+'</span>';
  return '<div class="m-head"><span class="m-close" onclick="closeModal()">'+ico('x')+'</span>'+
    '<div class="m-bar">'+backBtn(hasBack)+'<span class="pill" style="display:inline-flex;align-items:center;gap:5px">'+fl+'跨维度热点</span></div>'+
    '<h2>'+esc(ht.title)+'</h2><div style="margin-top:12px">'+dims+'</div></div>'+
    '<div class="m-body"><div class="blk"><div class="bd">'+esc(ht.summary)+'</div></div>'+
      '<div class="sec" style="margin:18px 0 13px"><h2 style="font-size:14px">'+ico('grid')+'关联条目（'+rel.length+'）</h2><div class="ln"></div></div>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+cards+'</div></div>';
}

function onSearch(v){state.q=v;if(["overview","hot","marks"].indexOf(state.view)>=0||DIM[state.view])render();}
